name: flutter_mobile_ppks
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.1.0
  # ===== FIREBASE (OPSIONAL / BACKUP DATA) =====
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.7.7

  # ===== AUTH & NETWORK =====
  google_sign_in: ^6.2.1
  http: ^1.2.0
  crypto: ^3.0.3

  # ===== LOCAL STORAGE (ANDROID + WEB) =====
  shared_preferences: ^2.2.3

  # ===== FILE & MEDIA =====
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  share_plus: ^7.2.1

  # ===== DATABASE (OPSIONAL, BELUM DIPAKAI) =====
  sqflite: ^2.3.0
  path: ^1.8.3 
  sqflite_common_ffi: ^2.2.0

  # ===== FORMAT & UI =====
  intl: ^0.18.1
  fl_chart: ^0.66.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/download (3).jpg
    - assets/images/Me.jpg
    - assets/images/google.jpg
