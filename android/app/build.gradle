plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.ppks.kawalkebun"
    compileSdk = 36

    signingConfigs {
        release {
            // Mencari key.properties di folder android/app/
            def keyProps = new Properties()
            def keyPropsFile = file('key.properties')
            
            if (keyPropsFile.exists()) {
                keyProps.load(new FileInputStream(keyPropsFile))
                
                storeFile = file(keyProps['storeFile'])
                storePassword = keyProps['storePassword']
                keyAlias = keyProps['keyAlias']
                keyPassword = keyProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId = "com.ppks.kawalkebun"
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            // Menggunakan tanda '=' untuk kompatibilitas AGP baru
            signingConfig = signingConfigs.release
            
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}